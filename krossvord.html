<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krossvord: O‘zbekistonning bozor iqtisodiyotiga o‘tishi</title>
<style>
:root{--bg:#faf6ee;--card:#ffffff;--ink:#1f2a44;--mute:#6b7287;--line:#c9d1e3;--accent:#1f6f6b;--acc2:#c8892b;--sel:#ffe9b8;--word:#dff1ee;--ok:#2e8b57;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--card:#1d2540;--ink:#eef1fa;--mute:#9aa3bd;--line:#3a4570;--accent:#4fc3b9;--acc2:#e3b05a;--sel:#6b5420;--word:#21415a;--ok:#5fd08e;--bad:#ff7a6b}}
:root[data-theme="dark"]{--bg:#141a2b;--card:#1d2540;--ink:#eef1fa;--mute:#9aa3bd;--line:#3a4570;--accent:#4fc3b9;--acc2:#e3b05a;--sel:#6b5420;--word:#21415a;--ok:#5fd08e;--bad:#ff7a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.35rem;margin:0 0 2px;color:var(--accent)}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
button{font:inherit;font-size:.9rem;padding:8px 14px;border-radius:999px;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer}
button.pri{background:var(--accent);color:var(--bg)}
.wrap{overflow-x:auto;padding-bottom:6px}
#grid{display:grid;gap:2px;width:max-content;margin:0 auto}
.c{width:clamp(20px,5.6vw,34px);height:clamp(20px,5.6vw,34px);position:relative}
.c.e{visibility:hidden}
.c input{width:100%;height:100%;border:1.5px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);text-align:center;font:600 clamp(11px,3.4vw,18px) Georgia,serif;text-transform:uppercase;padding:0;caret-color:transparent}
.c input.w{background:var(--word)}
.c input.s{background:var(--sel);border-color:var(--acc2)}
.c input.ok{color:var(--ok)}.c input.bad{color:var(--bad)}
.c i{position:absolute;top:1px;left:2px;font-size:clamp(7px,1.9vw,10px);font-style:normal;color:var(--mute);pointer-events:none;z-index:1}
.clues{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}

.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
h2{font-size:1rem;margin:0 0 8px;color:var(--acc2)}
ol{list-style:none;margin:0;padding:0}
li{padding:5px 6px;border-radius:6px;cursor:pointer;font-size:.92rem}
li b{color:var(--accent);margin-right:6px}
li.a{background:var(--word)}
li small{color:var(--mute)}
#msg{min-height:1.3em;font-size:.92rem;margin:8px 0 0;text-align:center}
@media print{.bar,#msg{display:none}body{background:#fff;color:#000}}
</style></head><body><main>
<h1>Krossvord: bozor iqtisodiyotiga o‘tish va ijtimoiy-ma’naviy islohotlar</h1>
<p class="sub">15 ta so‘z · mavzu: O‘zbekistonda ijtimoiy-iqtisodiy islohotlar va ta’lim tizimi</p>
<div class="bar"><button class="pri" id="chk">Tekshirish</button><button id="rev">Javoblar</button><button id="clr">Tozalash</button><button onclick="window.print()">Chop etish</button></div>
<div class="wrap"><div id="grid"></div></div>
<p id="msg"></p>
<div class="clues"><div class="box"><h2>Savollar</h2><ol id="ca"></ol></div></div>
</main>
<script>
var D={"h": 16, "w": 15, "entries": [{"n": 1, "w": "SARMOYA", "r": 0, "c": 10, "d": "D", "clue": "Iqtisodiyotga jalb etilishi lozim bo‘lgan xorij …si (investitsiya)"}, {"n": 2, "w": "NAFAQA", "r": 1, "c": 5, "d": "A", "clue": "Nogiron farzandini parvarish qiluvchi onalar uchun joriy etilgan ijtimoiy to‘lov turi"}, {"n": 3, "w": "PREZIDENT", "r": 2, "c": 14, "d": "D", "clue": "STEAM fanlari ingliz tilida o‘qitiladigan, Kembrij bilan hamkorlikda tashkil etilgan maktablar nomi"}, {"n": 4, "w": "KARIMOV", "r": 3, "c": 0, "d": "D", "clue": "Taraqqiyotning beshta tamoyilini ishlab chiqqan birinchi Prezident (familiyasi)"}, {"n": 5, "w": "KOLLEJ", "r": 3, "c": 3, "d": "D", "clue": "1997-yildan beri 1400 dan ortig‘i bunyod etilgan kasb-hunar ta’limi muassasasi"}, {"n": 6, "w": "UMID", "r": 3, "c": 9, "d": "A", "clue": "1997–2003-yillarda 828 nafar stipendiatni xorijda o‘qitgan jamg‘arma"}, {"n": 7, "w": "TOTALITAR", "r": 4, "c": 6, "d": "D", "clue": "Bozor iqtisodiyotiga o‘tishda o‘zini oqlamagan rejali iqtisodiy tizim turi"}, {"n": 8, "w": "MIGRATSIYA", "r": 5, "c": 8, "d": "D", "clue": "Aholi o‘troq bo‘lgani uchun ish kuchining siljishi (…) g‘oyat sust"}, {"n": 9, "w": "INFLYATSIYA", "r": 6, "c": 0, "d": "A", "clue": "1980-yillar oxirida byudjet defitsiti bilan birga ortib borgan narxlar o‘sishi"}, {"n": 10, "w": "TOMORQA", "r": 8, "c": 11, "d": "D", "clue": "Mayda tovar xo‘jaligi an’analarining kuchliligidan dalolat beradigan xo‘jalik turi"}, {"n": 11, "w": "KADRLAR", "r": 9, "c": 4, "d": "D", "clue": "1997-yilda qabul qilingan «… tayyorlash milliy dasturi»"}, {"n": 12, "w": "QONUN", "r": 9, "c": 10, "d": "A", "clue": "Hamma narsadan ustun bo‘lishi kerak bo‘lgan tamoyil: «… ning ustuvorligi»"}, {"n": 13, "w": "BEQARORLIK", "r": 12, "c": 0, "d": "A", "clue": "O‘tish davri iqtisodiyotining birinchi belgisi"}, {"n": 14, "w": "DAVLAT", "r": 14, "c": 7, "d": "A", "clue": "O‘tish davrida iqtisodiyotni boshqarish jilovini qo‘ldan bermasligi kerak bo‘lgan «bosh islohotchi»"}, {"n": 15, "w": "BOZOR", "r": 15, "c": 0, "d": "A", "clue": "Mustaqillikdan keyin O‘zbekiston o‘tishni maqsad qilgan ijtimoiy yo‘naltirilgan iqtisodiyot turi (… iqtisodiyoti)"}]};
var cells={},cur=null,dir="A",grid=document.getElementById("grid");
grid.style.gridTemplateColumns="repeat("+D.w+",auto)";
var ans={},nums={};
D.entries.forEach(function(e){nums[e.r+","+e.c]=e.n;for(var i=0;i<e.w.length;i++){var r=e.r+(e.d=="D"?i:0),c=e.c+(e.d=="A"?i:0);ans[r+","+c]=e.w[i]}});
for(var r=0;r<D.h;r++)for(var c=0;c<D.w;c++){var k=r+","+c,d=document.createElement("div");d.className="c";
 if(!ans[k]){d.className+=" e";grid.appendChild(d);continue}
 var inp=document.createElement("input");inp.maxLength=1;inp.setAttribute("autocomplete","off");inp.setAttribute("autocapitalize","characters");inp.setAttribute("aria-label","Katak "+(r+1)+"-qator, "+(c+1)+"-ustun");
 d.appendChild(inp);if(nums[k]){var n=document.createElement("i");n.textContent=nums[k];d.appendChild(n)}
 cells[k]=inp;inp.dataset.r=r;inp.dataset.c=c;grid.appendChild(d);
 (function(inp,r,c){
  inp.addEventListener("focus",function(){select(r,c,false)});
  inp.addEventListener("click",function(){select(r,c,true)});
  inp.addEventListener("input",function(){inp.value=inp.value.slice(-1).toUpperCase();inp.classList.remove("ok","bad");if(inp.value)step(r,c,1)});
  inp.addEventListener("keydown",function(ev){if(ev.key=="Backspace"&&!inp.value)step(r,c,-1,true);
   var m={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[ev.key];if(m){ev.preventDefault();var t=cells[(r+m[0])+","+(c+m[1])];if(t)t.focus()}});
 })(inp,r,c)}
function wordAt(r,c,d){return D.entries.filter(function(e){if(e.d!=d)return false;for(var i=0;i<e.w.length;i++){if(e.r+(d=="D"?i:0)==r&&e.c+(d=="A"?i:0)==c)return true}return false})[0]}
function select(r,c,toggle){var a=wordAt(r,c,"A"),b=wordAt(r,c,"D");
 if(toggle&&cur&&cur[0]==r&&cur[1]==c&&a&&b)dir=dir=="A"?"D":"A";
 else if(!(dir=="A"?a:b))dir=a?"A":"D";
 cur=[r,c];paint()}
function paint(){Object.keys(cells).forEach(function(k){cells[k].classList.remove("w","s")});
 document.querySelectorAll("li.a").forEach(function(l){l.classList.remove("a")});
 if(!cur)return;var e=wordAt(cur[0],cur[1],dir);if(!e)return;
 for(var i=0;i<e.w.length;i++)cells[(e.r+(e.d=="D"?i:0))+","+(e.c+(e.d=="A"?i:0))].classList.add("w");
 cells[cur[0]+","+cur[1]].classList.add("s");var li=document.getElementById("l"+e.d+e.n);if(li)li.classList.add("a")}
function step(r,c,s,del){var nr=r+(dir=="D"?s:0),nc=c+(dir=="A"?s:0),t=cells[nr+","+nc];if(t){t.focus();if(del)t.value=""}}
function clue(e){var li=document.createElement("li");li.id="l"+e.d+e.n;li.innerHTML="<b>"+e.n+".</b>"+e.clue+" <small>("+e.w.length+")</small>";
 li.onclick=function(){dir=e.d;cells[e.r+","+e.c].focus();select(e.r,e.c,false)};
 document.getElementById("ca").appendChild(li)}
D.entries.forEach(clue);
document.getElementById("chk").onclick=function(){var ok=0,tot=0,empty=0;
 Object.keys(cells).forEach(function(k){var v=cells[k].value;tot++;cells[k].classList.remove("ok","bad");if(!v){empty++;return}
  if(v==ans[k]){ok++;cells[k].classList.add("ok")}else cells[k].classList.add("bad")});
 document.getElementById("msg").textContent=ok==tot?"Barakalla! Hammasi to‘g‘ri.":ok+" ta katak to‘g‘ri, "+(tot-ok-empty)+" tasi xato, "+empty+" tasi bo‘sh."};
document.getElementById("rev").onclick=function(){Object.keys(cells).forEach(function(k){cells[k].value=ans[k];cells[k].classList.remove("bad");cells[k].classList.add("ok")});document.getElementById("msg").textContent=""};
document.getElementById("clr").onclick=function(){Object.keys(cells).forEach(function(k){cells[k].value="";cells[k].classList.remove("ok","bad")});document.getElementById("msg").textContent=""};
</script></body></html>
